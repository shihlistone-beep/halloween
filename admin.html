<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報名管理後台｜什浬鍋萬聖節</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#170e24;--bg2:#22143a;--card:#24173a;--card2:#2e1f48;--line:#3f2d5e;--text:#f7efe3;--muted:#bfaed6;
  --orange:#ff8a1f;--orange2:#ffb347;--green:#7ee0a1;--red:#ff6b6b;--blue:#8ec5ff}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;font-size:15px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
button,input{font:inherit}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--card2);color:var(--text);padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{border-color:#6a5390}
.btn.primary{background:var(--orange);color:#1a0f00;border-color:var(--orange)}
.hidden{display:none!important}

/* Login */
.login{max-width:360px;margin:16vh auto 0;text-align:center}
.login .icon{font-size:56px}
.login input{width:100%;margin:16px 0 10px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);outline:none}
.login input:focus{border-color:var(--orange)}
.login .btn{width:100%;padding:13px}
.msg{color:var(--red);min-height:22px;font-size:14px}

/* Top */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:20px;margin:0;flex:1;min-width:200px}
.top h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

/* Main Tabs */
.main-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--line)}
.main-tab{appearance:none;border:none;background:transparent;color:var(--muted);padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit}
.main-tab:hover{color:var(--text)}
.main-tab.on{color:var(--orange);border-bottom-color:var(--orange)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{color:var(--muted);font-size:13px}
.stat .v{font-size:26px;font-weight:900;line-height:1.2}
.stat .s{font-size:12.5px;color:var(--muted)}
.stat.hl{border-color:#ff8a1f88;background:linear-gradient(135deg,#3a2340,var(--card))}
.stat.hl .v{color:var(--orange)}
.stat.ok .v{color:var(--green)}
.bar{height:6px;background:var(--bg2);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}

/* Tools */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.search{flex:1;min-width:200px;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);outline:none}
.search:focus{border-color:var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:700}
.chip.on{background:var(--orange);border-color:var(--orange);color:#1a0f00}
.count{color:var(--muted);font-size:13px;margin:0 0 8px}

/* List */
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item.in{border-color:#7ee0a166;background:linear-gradient(90deg,#1f3a2c55,var(--card) 40%)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.id{font-weight:900;color:var(--orange);min-width:48px;font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0}
.main .n{font-weight:700;font-size:16px}
.main .p{color:var(--muted);font-size:13.5px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.b{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);white-space:nowrap}
.b.warn{border-color:#ff6b6b88;color:#ffb3b3}
.b.note{border-color:#ffb34788;color:var(--orange2)}
.ck{flex:none;min-width:84px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--muted);font-weight:900;cursor:pointer}
.ck.on{background:var(--green);border-color:var(--green);color:#0d2416}
.ck[disabled]{opacity:.5}
.detail{display:none;border-top:1px dashed var(--line);padding:12px 14px;background:var(--card2)}
.item.open .detail{display:block}
.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:14px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;word-break:break-word}
.detail a{color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;transition:opacity .3s}
/* Settings sections */
.set-sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.set-sec h2{font-size:18px;margin:0 0 12px}
.set-sec .desc{color:var(--muted);font-size:13px;margin:0 0 14px}
.field-label{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}
/* Image Manager */
.img-tabs{display:flex;gap:6px;margin-bottom:12px}
.img-tab{border:1.5px solid var(--line);background:transparent;color:var(--muted);padding:8px 16px;border-radius:99px;cursor:pointer;font-size:14px;font-weight:700}
.img-tab.on{background:var(--orange);border-color:var(--orange);color:#1a0f00}
.upload-area{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:14px}
.upload-area:hover,.upload-area.drag{border-color:var(--orange)}
.upload-area input{display:none}
.upload-area p{margin:4px 0;color:var(--muted);font-size:14px}
.upload-area .icon{font-size:36px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.img-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.img-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.img-card .info{padding:8px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-card .del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:0;cursor:pointer;font-size:16px;display:grid;place-items:center}
.img-card .del:hover{background:var(--red)}
.uploading{opacity:.5;pointer-events:none}
.preview-tag{position:fixed;top:8px;right:8px;background:#ffb347;color:#1a0f00;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;z-index:30}
@media (max-width:600px){.detail dl{grid-template-columns:1fr}.detail dt{margin-top:6px}.top .btn{flex:1}.main-tab{padding:10px 14px;font-size:14px}}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="login">
    <div class="icon">🎃</div>
    <h2 style="margin:6px 0 0">報名管理後台</h2>
    <p style="color:var(--muted);margin:4px 0 0">什浬鍋萬聖節親子遊街</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="請輸入管理密碼" autocomplete="current-password">
      <div class="msg" id="loginMsg"></div>
      <button class="btn primary" type="submit">登入</button>
    </form>
  </div>

  <div id="mainView" class="hidden">
    <div class="top">
      <h1>🎃 萬聖節遊街｜後台管理<small id="updated">—</small></h1>
      <button class="btn" id="refreshBtn">🔄 重新整理</button>
      <button class="btn" id="logoutBtn">登出</button>
    </div>

    <!-- ===== 主分頁 ===== -->
    <div class="main-tabs">
      <button class="main-tab on" data-tab="reg">📋 報名管理</button>
      <button class="main-tab" data-tab="settings">⚙️ 後台設定</button>
    </div>

    <!-- ===== 分頁1：報名管理 ===== -->
    <div class="tab-panel active" id="tabReg">
      <div class="stats" id="stats"></div>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="搜尋姓名、電話、編號、毛孩名字…">
        <div class="chips" id="chips"></div>
      </div>
      <p class="count" id="count"></p>
      <div style="margin-bottom:12px"><button class="btn" id="exportBtn">⬇️ 匯出 Excel (CSV)</button></div>
      <div class="list" id="list"></div>
    </div>

    <!-- ===== 分頁2：後台設定 ===== -->
    <div class="tab-panel" id="tabSettings">

      <!-- 活動資訊設定 -->
      <div class="set-sec">
        <h2>📋 活動資訊設定</h2>
        <p class="desc">修改後前台報名頁面會即時更新顯示</p>
        <div style="display:grid;gap:10px">
          <div><label class="field-label">📅 活動日期</label>
            <input type="text" id="evDate" class="search" placeholder="例：115年10月30日（星期五）"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label class="field-label">📍 集合地點</label>
              <input type="text" id="evLocation" class="search" placeholder="例：什浬鍋停車場"></div>
            <div><label class="field-label">📍 地址</label>
              <input type="text" id="evAddress" class="search" placeholder="例：雲林縣麥寮鄉中山路409號"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label class="field-label">⏰ 報到時間</label>
              <input type="text" id="evCheckinTime" class="search" placeholder="例：17:40－18:00"></div>
            <div><label class="field-label">🚶 出發時間</label>
              <input type="text" id="evDepartTime" class="search" placeholder="例：18:10 準時出發"></div>
          </div>
          <div><label class="field-label">👨‍👩‍👧 活動對象</label>
            <input type="text" id="evAudience" class="search" placeholder="例：親子家庭、寵物家庭及一般民眾"></div>
          <div><label class="field-label">📌 報到與參加須知（每行一條）</label>
            <textarea id="evRules" class="search" style="min-height:320px;resize:vertical;line-height:1.7;font-size:14px" placeholder="每行輸入一條須知&#10;例如：&#10;請於 17:40－18:00 至什浬鍋停車場完成報到&#10;兒童須由家長全程陪同，不可自行離隊"></textarea></div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn primary" id="saveEventBtn" style="flex:none">💾 儲存活動資訊</button>
            <span style="color:var(--muted);font-size:13px" id="eventStatus">載入中…</span>
          </div>
        </div>
      </div>

      <!-- 音樂管理 -->
      <div class="set-sec">
        <h2>🎵 背景音樂設定</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <input type="text" id="musicUrl" class="search" style="min-width:0;flex:1" placeholder="音樂檔案網址（例如：https://你的GitHub/halloween/bgm.mp3）">
          <button class="btn primary" id="saveMusicBtn" style="flex:none">💾 儲存</button>
        </div>
        <p style="color:var(--muted);font-size:13px;margin:0 0 4px" id="musicStatus">載入中…</p>
        <p style="color:var(--muted);font-size:12.5px;margin:0">💡 將 mp3 檔案上傳到 GitHub 倉庫，網址格式為 https://shihlistone-beep.github.io/halloween/檔名.mp3</p>
      </div>

      <!-- 圖片管理 -->
      <div class="set-sec">
        <h2>🖼️ 前端圖片管理</h2>
        <div class="img-tabs">
          <button class="img-tab on" data-cat="route">🗺️ 遊街路線圖</button>
          <button class="img-tab" data-cat="gift">🎁 活動禮物</button>
        </div>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept="image/*" multiple>
          <div class="icon">📤</div>
          <p><b>點擊選擇圖片</b>或拖拽到這裡</p>
          <p>支援 JPG / PNG / WebP，每張建議 2MB 以內</p>
        </div>
        <div class="img-grid" id="imgGrid"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
(function(){
  'use strict';

  // ====================================================
  // ★★★ 部署後請把下面的網址換成你的 Apps Script 部署網址 ★★★
  // ====================================================
  const API_URL = 'https://script.google.com/macros/s/AKfycbySRgwJflpUq4JCQWh9XHaJIBtZkRHMSnbPkWsySuvZjlRvLREdMsplCuL7kwc_OQmT/exec';
  // ====================================================

  const IS_PREVIEW = !API_URL;
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  let PW = '', ROWS = [], FIELDS = [], FILTER = 'all', timer = null;

  const store = {
    get(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } },
    set(k,v){ try { v ? sessionStorage.setItem(k,v) : sessionStorage.removeItem(k); } catch(e){} }
  };

  if (IS_PREVIEW) { const t = document.createElement('div'); t.className = 'preview-tag'; t.textContent = '預覽模式・範例資料'; document.body.appendChild(t); }

  // ---------- 主分頁切換 ----------
  $$('.main-tab').forEach(tab => {
    tab.onclick = () => {
      $$('.main-tab').forEach(t => t.classList.remove('on'));
      tab.classList.add('on');
      $$('.tab-panel').forEach(p => p.classList.remove('active'));
      const target = tab.dataset.tab === 'reg' ? '#tabReg' : '#tabSettings';
      $(target).classList.add('active');
    };
  });

  // ---------- 後端呼叫 ----------
  async function api(action, payload) {
    if (IS_PREVIEW) {
      await new Promise(r => setTimeout(r, 300));
      if (action === 'adminGetData') return mockData();
      if (action === 'adminSetCheckin') return { id: payload.id, checkedIn: payload.checked ? '✔' : '', checkinTime: payload.checked ? new Date().toTimeString().slice(0,8) : '' };
      if (action === 'getImages') return mockImages();
      if (action === 'adminUploadImage') { const img = { id:'mock_'+Date.now(), category:payload.category, name:payload.fileName, url:'https://placehold.co/400x400/e67e22/fff?text='+encodeURIComponent(payload.fileName), createdAt:new Date().toLocaleString('zh-TW') }; window._mockImgs.push(img); return { ok:true, image:img }; }
      if (action === 'adminDeleteImage') { window._mockImgs = window._mockImgs.filter(i=>i.id!==payload.fileId); return { ok:true }; }
      if (action === 'adminDeleteRegistration') { window._mock = window._mock.filter(r=>r.id!==payload.id); return { ok:true, id:payload.id }; }
      return {};
    }
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ action, ...payload }),
      redirect: 'follow',
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  // ---------- 登入 ----------
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); login($('#pw').value); });
  async function login(pw) {
    $('#loginMsg').textContent = '';
    try {
      const data = await api('adminGetData', { pw });
      PW = pw; store.set('hw_pw', pw);
      $('#loginView').classList.add('hidden'); $('#mainView').classList.remove('hidden');
      apply(data);
      clearInterval(timer); timer = setInterval(load, 30000);
    } catch (err) {
      store.set('hw_pw', '');
      $('#loginMsg').textContent = (err && err.message) || '登入失敗';
    }
  }
  $('#logoutBtn').onclick = () => { store.set('hw_pw',''); PW=''; clearInterval(timer); location.reload(); };
  const saved = store.get('hw_pw'); if (saved) login(saved);

  // ---------- 資料 ----------
  async function load() {
    try { apply(await api('adminGetData', { pw: PW })); }
    catch (err) { toast('更新失敗：' + ((err && err.message) || err)); }
  }
  $('#refreshBtn').onclick = () => { load(); toast('已重新整理'); };

  function apply(data) {
    ROWS = data.rows || []; FIELDS = data.fields || [];
    $('#updated').textContent = '最後更新 ' + (data.serverTime || '') + '・每 30 秒自動更新';
    renderStats(); renderChips(); renderList();
  }

  const num = v => parseInt(v, 10) || 0;
  const hasKids = r => num(r.children) > 0;
  const hasPets = r => num(r.petCount) > 0;
  const isIn = r => !!r.checkedIn;

  function renderStats() {
    const s = { groups: ROWS.length, people: 0, adults: 0, kids: 0, pets: 0, inG: 0, inP: 0, stroller: 0, infant: 0, petStroller: 0, noPhoto: 0, nervous: 0 };
    ROWS.forEach(r => {
      s.people += num(r.totalPeople); s.pets += num(r.petCount);
      s.kids += num(r.children);
      if (isIn(r)) { s.inG++; s.inP += num(r.totalPeople); }
      if (r.needStroller === '需要') s.stroller++;
      if (r.hasInfant === '有') s.infant++;
      if (/推車/.test(r.petMode)) s.petStroller++;
      if (r.photoConsent === '不同意') s.noPhoto++;
      if (/緊張|慢熟|自己的空間/.test(r.petTemper) || r.petNote) s.nervous++;
    });
    const pct = s.people ? Math.round(s.inP / s.people * 100) : 0;
    const card = (k, v, sub, cls) => '<div class="stat ' + (cls||'') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
    $('#stats').innerHTML =
      card('報名組數', s.groups, '', 'hl') +
      card('總人數', s.people, '兒童 ' + s.kids + ' 人', 'hl') +
      card('毛孩', s.pets + ' 隻', '使用寵物推車 ' + s.petStroller + ' 組') +
      '<div class="stat ok"><div class="k">已報到</div><div class="v">' + s.inP + ' / ' + s.people + '</div><div class="s">' + s.inG + ' 組・' + pct + '%</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
      card('嬰兒推車', s.stroller + ' 組', '嬰幼兒同行 ' + s.infant + ' 組') +
      card('毛孩需留意', s.nervous + ' 組', '慢熟／緊張／有備註') +
      card('不同意拍照', s.noPhoto + ' 組', '攝影請避開');
  }

  const FILTERS = [
    ['all','全部', () => true],
    ['todo','未報到', r => !isIn(r)],
    ['done','已報到', r => isIn(r)],
    ['kids','有小孩', hasKids],
    ['pets','有毛孩', hasPets],
    ['nophoto','不同意拍照', r => r.photoConsent === '不同意'],
    ['note','有備註', r => !!(r.note || r.petNote)],
  ];
  function renderChips() {
    const box = $('#chips'); box.innerHTML = '';
    FILTERS.forEach(([k, label, fn]) => {
      const b = document.createElement('button');
      b.className = 'chip' + (FILTER === k ? ' on' : '');
      b.textContent = label + ' ' + ROWS.filter(fn).length;
      b.onclick = () => { FILTER = k; renderChips(); renderList(); };
      box.appendChild(b);
    });
  }

  $('#q').addEventListener('input', () => renderList());

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const openSet = new Set();
  function renderList() {
    const q = $('#q').value.trim().toLowerCase();
    const qd = q.replace(/\D/g, '');
    const fn = (FILTERS.find(f => f[0] === FILTER) || FILTERS[0])[2];
    const rows = ROWS.filter(fn).filter(r => {
      if (!q) return true;
      const hay = [r.id, r.name, r.email, r.petNames, r.note].join(' ').toLowerCase();
      return hay.includes(q) || (qd.length >= 3 && String(r.phone).replace(/\D/g,'').includes(qd));
    });
    $('#count').textContent = '顯示 ' + rows.length + ' / ' + ROWS.length + ' 筆';
    const list = $('#list');
    if (!rows.length) { list.innerHTML = '<div class="empty">' + (ROWS.length ? '找不到符合的報名' : '目前還沒有報名資料 👻') + '</div>'; return; }

    list.innerHTML = rows.map(r => {
      const badges = [];
      badges.push('<span class="b">👥 ' + esc(r.totalPeople) + '人</span>');
      if (hasKids(r)) badges.push('<span class="b">👧 兒童' + esc(r.children) + '</span>');
      if (hasPets(r)) badges.push('<span class="b">🐾 ' + esc(r.petCount) + '隻' + (r.petNames ? '・' + esc(r.petNames) : '') + '</span>');
      if (r.needStroller === '需要') badges.push('<span class="b">🍼 推車</span>');
      if (r.photoConsent === '不同意') badges.push('<span class="b warn">🚫 不拍照</span>');
      if (r.note || r.petNote) badges.push('<span class="b note">📝 備註</span>');
      const det = FIELDS.filter(([k]) => r[k] && !['id','name'].includes(k))
        .map(([k, label]) => '<dt>' + esc(label) + '</dt><dd>' + (k === 'phone' ? '<a href="tel:' + esc(String(r[k]).replace(/[^\d+]/g,'')) + '">' + esc(r[k]) + '</a>' : esc(r[k])) + '</dd>').join('');
      return '<div class="item' + (isIn(r) ? ' in' : '') + (openSet.has(r.id) ? ' open' : '') + '" data-id="' + esc(r.id) + '">' +
        '<div class="row"><div class="id">' + esc(r.id) + '</div>' +
        '<div class="main"><div class="n">' + esc(r.name) + '</div><div class="p">' + esc(r.phone) + (isIn(r) ? '・' + esc(r.checkinTime) + ' 報到' : '') + '</div><div class="badges">' + badges.join('') + '</div></div>' +
        '<button class="ck' + (isIn(r) ? ' on' : '') + '" data-ck>' + (isIn(r) ? '✔ 已報到' : '報到') + '</button></div>' +
        '<div class="detail"><dl>' + det + '</dl><div style="margin-top:12px;text-align:right"><button class="btn" style="color:var(--red);border-color:var(--red);font-size:13px;padding:6px 14px" data-delete="' + esc(r.id) + '">🗑️ 刪除此報名</button></div></div></div>';
    }).join('');
  }

  $('#list').addEventListener('click', async e => {
    const item = e.target.closest('.item'); if (!item) return;
    const id = item.dataset.id;
    const r = ROWS.find(x => x.id === id);
    if (e.target.closest('[data-ck]')) {
      const btn = e.target.closest('[data-ck]');
      const next = !isIn(r);
      if (!next && !confirm('取消 ' + r.id + ' ' + r.name + ' 的報到？')) return;
      btn.disabled = true;
      try {
        const res = await api('adminSetCheckin', { pw: PW, id, checked: next });
        r.checkedIn = res.checkedIn; r.checkinTime = res.checkinTime;
        renderStats(); renderChips(); renderList();
        toast(next ? '✔ ' + r.name + ' 已報到' : '已取消報到');
      } catch (err) { btn.disabled = false; toast('失敗：' + ((err && err.message) || err)); }
      return;
    }
    if (e.target.closest('[data-delete]')) {
      const delBtn = e.target.closest('[data-delete]');
      const delId = delBtn.dataset.delete;
      const delR = ROWS.find(x => x.id === delId);
      if (!confirm('⚠️ 確定要刪除 ' + delId + ' ' + (delR ? delR.name : '') + ' 的報名？\n\n此操作無法復原！')) return;
      delBtn.disabled = true;
      try {
        await api('adminDeleteRegistration', { pw: PW, id: delId });
        ROWS = ROWS.filter(x => x.id !== delId);
        openSet.delete(delId);
        renderStats(); renderChips(); renderList();
        toast('🗑️ 已刪除 ' + delId + (delR ? ' ' + delR.name : ''));
      } catch (err) { delBtn.disabled = false; toast('刪除失敗：' + ((err && err.message) || err)); }
      return;
    }
    if (e.target.closest('a')) return;
    if (e.target.closest('.row')) { openSet.has(id) ? openSet.delete(id) : openSet.add(id); item.classList.toggle('open'); }
  });

  // ---------- 匯出 CSV（含 BOM，Excel 開啟不亂碼） ----------
  $('#exportBtn').onclick = () => {
    if (!ROWS.length) return toast('目前沒有資料');
    const cell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const lines = [FIELDS.map(f => cell(f[1])).join(',')]
      .concat(ROWS.map(r => FIELDS.map(([k]) => k === 'phone' ? cell('\t' + r[k]) : cell(r[k])).join(',')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    const d = new Date(); const pad = n => String(n).padStart(2,'0');
    a.href = URL.createObjectURL(blob);
    a.download = '萬聖節遊街報名_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  function toast(t) {
    const el = $('#toast'); el.textContent = t; el.classList.remove('hidden'); el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.classList.add('hidden'), 300); }, 1800);
  }

  // ---------- 圖片管理 ----------
  let IMG_CAT = 'route', IMAGES = [];

  $$('.img-tab').forEach(tab => {
    tab.onclick = () => {
      $$('.img-tab').forEach(t => t.classList.remove('on'));
      tab.classList.add('on');
      IMG_CAT = tab.dataset.cat;
      renderImages();
    };
  });

  const uploadArea = $('#uploadArea');
  const fileInput = $('#fileInput');
  uploadArea.onclick = () => fileInput.click();
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
  uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

  async function handleFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) { toast('只能上傳圖片檔案'); continue; }
      if (file.size > 5 * 1024 * 1024) { toast(file.name + ' 超過 5MB，請壓縮後再試'); continue; }
      uploadArea.classList.add('uploading');
      try {
        const base64 = await fileToBase64(file);
        const res = await api('adminUploadImage', { pw: PW, category: IMG_CAT, fileName: file.name, base64 });
        if (res.ok && res.image) { IMAGES.push(res.image); renderImages(); toast('✔ 已上傳 ' + file.name); }
      } catch (err) { toast('上傳失敗：' + (err.message || err)); }
      uploadArea.classList.remove('uploading');
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderImages() {
    const grid = $('#imgGrid');
    const filtered = IMAGES.filter(i => i.category === IMG_CAT);
    if (!filtered.length) { grid.innerHTML = '<p style="color:var(--muted);font-size:14px">尚未上傳' + (IMG_CAT === 'route' ? '路線圖' : '禮物圖片') + '</p>'; return; }
    grid.innerHTML = filtered.map(i =>
      '<div class="img-card"><img src="' + esc(i.url) + '" alt="' + esc(i.name) + '" loading="lazy">' +
      '<div class="info">' + esc(i.name) + '</div>' +
      '<button class="del" data-del="' + esc(i.id) + '" title="刪除">&times;</button></div>'
    ).join('');
  }

  $('#imgGrid').addEventListener('click', async e => {
    const btn = e.target.closest('[data-del]');
    if (!btn) return;
    const id = btn.dataset.del;
    const img = IMAGES.find(i => i.id === id);
    if (!confirm('確定刪除' + (img ? ' ' + img.name : '') + '？')) return;
    btn.disabled = true;
    try {
      await api('adminDeleteImage', { pw: PW, fileId: id });
      IMAGES = IMAGES.filter(i => i.id !== id);
      renderImages();
      toast('已刪除');
    } catch (err) { toast('刪除失敗：' + (err.message || err)); btn.disabled = false; }
  });

  async function loadImages() {
    try {
      const res = await api('getImages');
      IMAGES = (res && res.images) || [];
      renderImages();
    } catch (e) {}
  }

  // ---------- 活動資訊管理 ----------
  async function loadEventInfo() {
    try {
      const res = await api('getEventInfo');
      if (res) {
        $('#evDate').value = res.date || '';
        $('#evLocation').value = res.location || '';
        $('#evAddress').value = res.address || '';
        $('#evCheckinTime').value = res.checkinTime || '';
        $('#evDepartTime').value = res.departTime || '';
        $('#evAudience').value = res.audience || '';
        $('#evRules').value = (res.rules || []).join('\n');
        $('#eventStatus').textContent = '✅ 已載入目前設定';
      }
    } catch (e) { $('#eventStatus').textContent = '⚠️ 載入失敗（請確認 Code.gs 已部署新版本）'; }
  }
  $('#saveEventBtn').addEventListener('click', async () => {
    const data = {
      date: $('#evDate').value.trim(),
      location: $('#evLocation').value.trim(),
      address: $('#evAddress').value.trim(),
      checkinTime: $('#evCheckinTime').value.trim(),
      departTime: $('#evDepartTime').value.trim(),
      audience: $('#evAudience').value.trim(),
      rules: $('#evRules').value.split('\n').map(s => s.trim()).filter(s => s)
    };
    $('#saveEventBtn').disabled = true;
    try {
      await api('adminSetEventInfo', { pw: PW, data });
      $('#eventStatus').textContent = '✅ 活動資訊已儲存';
      toast('✔ 活動資訊已更新');
    } catch (err) { toast('儲存失敗：' + (err.message || err)); }
    $('#saveEventBtn').disabled = false;
  });

  // ---------- 音樂管理 ----------
  async function loadMusic() {
    try {
      const res = await api('getMusic');
      const url = (res && res.url) || '';
      $('#musicUrl').value = url;
      $('#musicStatus').textContent = url ? '✅ 目前音樂：' + url : '⚠️ 尚未設定背景音樂';
    } catch (e) { $('#musicStatus').textContent = '載入失敗'; }
  }
  $('#saveMusicBtn').addEventListener('click', async () => {
    const url = $('#musicUrl').value.trim();
    $('#saveMusicBtn').disabled = true;
    try {
      await api('adminSetMusic', { pw: PW, url: url });
      $('#musicStatus').textContent = url ? '✅ 已儲存：' + url : '⚠️ 已清除背景音樂';
      toast('✔ 背景音樂已更新');
    } catch (err) { toast('儲存失敗：' + (err.message || err)); }
    $('#saveMusicBtn').disabled = false;
  });

  // 登入成功後也載入圖片、音樂、活動資訊
  const origApply = apply;
  apply = function(data) { origApply(data); loadImages(); loadMusic(); loadEventInfo(); };

  // ---------- 預覽用範例資料 ----------
  function mockImages() {
    if (!window._mockImgs) window._mockImgs = [
      { id:'mock_r1', category:'route', name:'遊街路線圖.jpg', url:'https://placehold.co/800x600/ff6600/ffffff?text=🗺️+遊街路線圖', createdAt:'2026-10-18 10:00:00' },
      { id:'mock_g1', category:'gift', name:'彩色提袋.jpg', url:'https://placehold.co/400x400/9b59b6/ffffff?text=🎁+彩色提袋', createdAt:'2026-10-18 10:01:00' },
      { id:'mock_g2', category:'gift', name:'黑色提袋.jpg', url:'https://placehold.co/400x400/2c3e50/ffffff?text=🎁+黑色提袋', createdAt:'2026-10-18 10:02:00' },
    ];
    return { images: window._mockImgs };
  }

    return { rows: window._mock, fields: F, serverTime: new Date().toLocaleString('zh-TW') };

})();
